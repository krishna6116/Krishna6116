<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
<title id="t">CareOps AI: End-to-end hospital resource-planning platform on synthetic data: demand forecasting plus bed, staff and appointment optimization.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF3FA"/><stop offset=".55" stop-color="#D6E5F1"/><stop offset="1" stop-color="#C7DAEB"/></linearGradient>
<radialGradient id="glow" cx="6.0%" cy="0.0%" r="55%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="100%" cy="100%" r="50%"><stop offset="0" stop-color="#8CB2DA" stop-opacity=".55"/><stop offset="1" stop-color="#8CB2DA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".55"/></pattern>
<linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0"><stop offset="0" stop-color="#2F74D0"/><stop offset="1" stop-color="#2F74D0" stop-opacity="0"/></linearGradient>
<clipPath id="round"><rect width="1280" height="640" rx="24"/></clipPath>

</defs>

<style>
.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
.mono{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{animation:rise 1.3s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade 1.6s cubic-bezier(.16,1,.3,1) both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.65,0,.35,1) .6s forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glowmove{animation:drift 14s ease-in-out infinite alternate}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.75s}
.d5{animation-delay:1s}.d6{animation-delay:1.25s}.d7{animation-delay:1.5s}.d8{animation-delay:1.8s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
@media (prefers-reduced-motion:reduce){.rise,.fade,.pulse,.glowmove{animation:none}.draw{animation:none;stroke-dashoffset:0}}

</style>
<g clip-path="url(#round)">
<rect width="1280" height="640" fill="url(#bg)"/>
<rect class="glowmove" x="-80" y="-60" width="1440" height="760" fill="url(#glow)"/>
<rect width="1280" height="640" fill="url(#glow2)"/>
<g class="rise d1"><text x="64" y="84" class="mono " font-size="15" font-weight="700" fill="#2F74D0" text-anchor="start" letter-spacing="2" >01 · HEALTHCARE OPERATIONS OPTIMIZATION PLATFORM</text><text x="608" y="84" class="mono" font-size="15" font-weight="700" fill="#1B4F9C" letter-spacing="2">● LIVE DEMO</text></g>
<text x="62" y="166" class="serif rise d2" font-size="64" font-weight="700" fill="#173A66">CareOps <tspan font-style="italic" font-weight="400" fill="#2F74D0">AI</tspan></text>
<text x="64" y="210" class="sans rise d3" font-size="24" font-weight="500" fill="#4B6584" text-anchor="start" >End-to-end hospital resource-planning platform on synthetic</text>
<text x="64" y="244" class="sans rise d3" font-size="24" font-weight="500" fill="#4B6584" text-anchor="start" >data: demand forecasting plus bed, staff and appointment</text>
<text x="64" y="278" class="sans rise d3" font-size="24" font-weight="500" fill="#4B6584" text-anchor="start" >optimization.</text>
<text x="64" y="320" class="mono rise d4" font-size="14" font-weight="700" fill="#7189A6" letter-spacing="1.5"><tspan fill="#2F74D0">BUILT ›</tspan> XGBOOST → CP-SAT → POSTGRESQL → FASTAPI → REACT · AI ASSISTANT</text>
<line x1="64" y1="346" x2="820" y2="346" stroke="#C3D6E8" stroke-width="1.5" pathLength="1" class="draw"/>
<g class="rise d5"><text x="64" y="408" class="serif " font-size="50" font-weight="700" fill="#173A66" text-anchor="start" >8.72</text><text x="64" y="438" class="sans " font-size="16" font-weight="500" fill="#4B6584" text-anchor="start" >occupied-beds MAE vs</text><text x="64" y="460" class="sans " font-size="16" font-weight="500" fill="#4B6584" text-anchor="start" >11.88 baseline</text></g>
<g class="rise d6"><text x="314" y="408" class="serif " font-size="50" font-weight="700" fill="#173A66" text-anchor="start" >27 → 0</text><text x="314" y="438" class="sans " font-size="16" font-weight="500" fill="#4B6584" text-anchor="start" >unfilled staff positions vs</text><text x="314" y="460" class="sans " font-size="16" font-weight="500" fill="#4B6584" text-anchor="start" >first-fit</text></g>
<g class="rise d7"><text x="564" y="408" class="serif " font-size="50" font-weight="700" fill="#173A66" text-anchor="start" >77 → 0</text><text x="564" y="438" class="sans " font-size="16" font-weight="500" fill="#4B6584" text-anchor="start" >doctor double-bookings</text></g>
<g class="rise d7"><rect x="64.0" y="512" width="91.7" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="109.8" y="535.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">Python</text></g>
<g class="rise d7"><rect x="165.7" y="512" width="134.1" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="232.7" y="535.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">Scikit-Learn</text></g>
<g class="rise d7"><rect x="309.8" y="512" width="107.8" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="363.7" y="535.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">XGBoost</text></g>
<g class="rise d7"><rect x="427.6" y="512" width="110.5" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="482.8" y="535.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">OR-Tools</text></g>
<g class="rise d7"><rect x="548.1" y="512" width="135.1" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="615.7" y="535.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">PostgreSQL</text></g>
<g class="rise d7"><rect x="693.2" y="512" width="97.7" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="742.1" y="535.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">FastAPI</text></g>
<g class="rise d7"><rect x="64.0" y="557" width="123.5" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="125.8" y="580.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">React + TS</text></g>
<g class="rise d7"><rect x="197.5" y="557" width="91.7" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="243.3" y="580.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">Docker</text></g>
<g class="rise d7"><rect x="299.2" y="557" width="161.7" height="35" rx="17.5" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="380.0" y="580.6" class="sans" font-size="17" font-weight="600" fill="#1E4470" text-anchor="middle">GitHub Actions</text></g>
<g class="fade d3"><rect x="862" y="52" width="370" height="470" rx="20" fill="#FFFFFF" fill-opacity=".7" stroke="#C3D6E8"/></g>
<g transform="translate(862,52)"><text x="24" y="44" class="mono " font-size="12" font-weight="700" fill="#7189A6" text-anchor="start" letter-spacing="2" >FORECAST → OPTIMIZE</text><g class="rise d2"><rect x="22" y="80" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="97" y="109" class="sans " font-size="16" font-weight="600" fill="#173A66" text-anchor="middle" >Admissions</text></g><path d="M172 103 C 205 103, 205 197, 232 197" fill="none" stroke="#2F74D0" stroke-width="2" stroke-opacity=".8" pathLength="1" class="draw" style="animation-delay:1.20s"/><g class="rise d3"><rect x="22" y="146" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="97" y="175" class="sans " font-size="16" font-weight="600" fill="#173A66" text-anchor="middle" >Occupancy</text></g><path d="M172 169 C 205 169, 205 197, 232 197" fill="none" stroke="#2F74D0" stroke-width="2" stroke-opacity=".8" pathLength="1" class="draw" style="animation-delay:1.35s"/><g class="rise d4"><rect x="22" y="212" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="97" y="241" class="sans " font-size="16" font-weight="600" fill="#173A66" text-anchor="middle" >ICU · LOS</text></g><path d="M172 235 C 205 235, 205 197, 232 197" fill="none" stroke="#2F74D0" stroke-width="2" stroke-opacity=".8" pathLength="1" class="draw" style="animation-delay:1.50s"/><g class="rise d5"><rect x="22" y="278" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#C3D6E8" stroke-opacity="1"/><text x="97" y="307" class="sans " font-size="16" font-weight="600" fill="#173A66" text-anchor="middle" >No-shows</text></g><path d="M172 301 C 205 301, 205 197, 232 197" fill="none" stroke="#2F74D0" stroke-width="2" stroke-opacity=".8" pathLength="1" class="draw" style="animation-delay:1.65s"/><g class="rise d6"><rect x="232" y="160" width="118" height="74" rx="14" fill="#2F74D0"/><text x="291" y="194" class="sans " font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >OR-Tools</text><text x="291" y="216" class="mono " font-size="13" font-weight="700" fill="#DBE7F7" text-anchor="middle" >CP-SAT</text></g><line x1="291" y1="234" x2="291" y2="262" stroke="#2F74D0" stroke-width="2" pathLength="1" class="draw" style="animation-delay:1.9s"/><g class="rise d6"><rect x="226" y="266" width="130" height="34" rx="17" fill="#E3EEF9" stroke="#C3D6E8" stroke-opacity="0"/><text x="291" y="289" class="sans " font-size="15" font-weight="600" fill="#2F74D0" text-anchor="middle" >Beds</text></g><g class="rise d7"><rect x="226" y="310" width="130" height="34" rx="17" fill="#E3EEF9" stroke="#C3D6E8" stroke-opacity="0"/><text x="291" y="333" class="sans " font-size="15" font-weight="600" fill="#2F74D0" text-anchor="middle" >Staff shifts</text></g><g class="rise d8"><rect x="226" y="354" width="130" height="34" rx="17" fill="#E3EEF9" stroke="#C3D6E8" stroke-opacity="0"/><text x="291" y="377" class="sans " font-size="15" font-weight="600" fill="#2F74D0" text-anchor="middle" >Appointments</text></g><circle cx="291" cy="197" r="44" fill="none" stroke="#2F74D0" stroke-opacity=".5" class="pulse" style="animation-duration:3s"/></g>
<text x="1047.0" y="562" class="mono fade d8" font-size="12" font-weight="700" fill="#7189A6" text-anchor="middle" letter-spacing="2" >SYNTHETIC DATA · SIMULATED RESULTS</text>
</g>
<rect x=".75" y=".75" width="1278.5" height="638.5" rx="23.5" fill="none" stroke="#C3D6E8" stroke-opacity="1" stroke-width="1.5"/>
